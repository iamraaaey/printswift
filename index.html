    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Initialize Firebase if environment variables exist
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'printswift-unimas-pilot';
        let db = null;
        let auth = null;
        let firebaseUser = null;

        async function initDatabase() {
            try {
                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    const firebaseConfig = JSON.parse(__firebase_config);
                    const app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }

                    onAuthStateChanged(auth, (user) => {
                        if (user) {
                            firebaseUser = user;
                            document.getElementById('db-sync-badge').innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-lime-300"></span> Cloud DB Live`;
                            attachFirestoreListeners();
                        }
                    });
                } else {
                    document.getElementById('db-sync-badge').innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-300"></span> Demo DB`;
                }
            } catch (err) {
                console.error("Database init fallback:", err);
                document.getElementById('db-sync-badge').innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-300"></span> Local Mode`;
            }
        }

        function attachFirestoreListeners() {
            if (!db || !firebaseUser) return;

            // Listen to public orders collection (Rule 1 & Rule 2 compliant)
            const ordersCol = collection(db, 'artifacts', appId, 'public', 'data', 'print_orders');
            onSnapshot(ordersCol, (snapshot) => {
                const dbOrders = [];
                snapshot.forEach((docSnap) => {
                    dbOrders.push({ firestoreId: docSnap.id, ...docSnap.data() });
                });
                if (dbOrders.length > 0) {
                    dbOrders.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                    window.state.orders = dbOrders;
                    if (window.state.isAuthenticated) window.render();
                }
            }, (error) => {
                console.error("Orders snapshot error:", error);
            });

            // Listen to registered users directory
            const usersCol = collection(db, 'artifacts', appId, 'public', 'data', 'registered_users');
            onSnapshot(usersCol, (snapshot) => {
                const usersList = [];
                snapshot.forEach((docSnap) => {
                    usersList.push(docSnap.data());
                });
                if (usersList.length > 0) {
                    window.state.registeredAccounts = usersList;
                }
            }, (error) => {
                console.error("Users snapshot error:", error);
            });
        }

        // Expose DB helpers to global window for UI actions
        window.dbService = {
            async saveUserAccount(accountObj) {
                if (!db || !firebaseUser) return;
                try {
                    const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'registered_users', accountObj.email.replace(/[^a-zA-Z0-9]/g, '_'));
                    await setDoc(userDocRef, { ...accountObj, uid: firebaseUser.uid, updatedAt: Date.now() }, { merge: true });
                } catch (e) {
                    console.error("Error saving user:", e);
                }
            },
            async saveOrder(orderObj) {
                if (!db || !firebaseUser) return;
                try {
                    const orderDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'print_orders', orderObj.id);
                    await setDoc(orderDocRef, { ...orderObj, createdAt: orderObj.createdAt || Date.now() }, { merge: true });
                } catch (e) {
                    console.error("Error saving order:", e);
                }
            }
        };

        initDatabase();
    </script>

        // --- AUDIO, CONFETTI & QR ENGINE ---
        function playAppSound(type = 'success') {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const now = ctx.currentTime;
                
                if (type === 'scan' || type === 'chime') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now); // D5
                    osc.frequency.setValueAtTime(880.00, now + 0.08); // A5
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.28);
                } else if (type === 'cash') {
                    const osc1 = ctx.createOscillator();
                    const osc2 = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc1.type = 'triangle';
                    osc2.type = 'sine';
                    osc1.frequency.setValueAtTime(523.25, now); // C5
                    osc2.frequency.setValueAtTime(1046.50, now + 0.07); // C6
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc1.connect(gain);
                    osc2.connect(gain);
                    gain.connect(ctx.destination);
                    osc1.start(now);
                    osc2.start(now + 0.07);
                    osc1.stop(now + 0.35);
                    osc2.stop(now + 0.35);
                } else {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.15);
                }
            } catch(e) {}
        }

        // --- High-Fidelity Client-Side QR Code Generator ---
        function generateQRCode(elementId, text, size = 140) {
            const container = typeof elementId === 'string' ? document.getElementById(elementId) : elementId;
            if (!container) return;
            container.innerHTML = '';
            
            try {
                if (window.QRCode) {
                    new QRCode(container, {
                        text: text,
                        width: size,
                        height: size,
                        colorDark: "#0f172a",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.M
                    });
                    return;
                }
            } catch (err) {
                console.warn('QRCode JS note, fallback to dynamic image:', err);
            }

            // Universal high-res fallback
            const img = document.createElement('img');
            img.src = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&margin=4&data=${encodeURIComponent(text)}`;
            img.alt = 'QR Code';
            img.className = 'w-full h-full object-contain rounded-lg';
            container.appendChild(img);
        }

        // --- Universal Real-Time QR Scanner (Camera & File) ---
        window.activeScannerStream = null;
        window.activeScannerRaf = null;

        function stopActiveScannerStream() {
            if (window.activeScannerRaf) {
                cancelAnimationFrame(window.activeScannerRaf);
                window.activeScannerRaf = null;
            }
            if (window.activeScannerStream) {
                try {
                    window.activeScannerStream.getTracks().forEach(t => t.stop());
                } catch (e) {}
                window.activeScannerStream = null;
            }
        }

        function startUniversalQRScanner(videoElementId, onDecodedCallback) {
            const video = document.getElementById(videoElementId);
            const fallbackMsg = document.getElementById('camera-fallback-msg');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            stopActiveScannerStream();

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                if (fallbackMsg) fallbackMsg.classList.remove('hidden');
                return;
            }

            navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } }
            })
            .then(stream => {
                window.activeScannerStream = stream;
                if (!video) return;
                video.srcObject = stream;
                video.setAttribute('playsinline', true);
                video.play().catch(e => console.log('Video play note:', e));
                if (fallbackMsg) fallbackMsg.classList.add('hidden');

                function scanLoop() {
                    if (!window.activeScannerStream || !video || video.readyState !== video.HAVE_ENOUGH_DATA) {
                        window.activeScannerRaf = requestAnimationFrame(scanLoop);
                        return;
                    }

                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                    let foundCode = null;

                    if (window.jsQR) {
                        const code = jsQR(imageData.data, imageData.width, imageData.height, {
                            inversionAttempts: 'dontInvert'
                        });
                        if (code && code.data) {
                            foundCode = code.data;
                        }
                    }

                    if (foundCode) {
                        stopActiveScannerStream();
                        onDecodedCallback(foundCode);
                        return;
                    }

                    window.activeScannerRaf = requestAnimationFrame(scanLoop);
                }

                window.activeScannerRaf = requestAnimationFrame(scanLoop);
            })
            .catch(err => {
                console.warn('Camera stream warning:', err);
                if (fallbackMsg) fallbackMsg.classList.remove('hidden');
            });
        }

        function scanQRFromImageFile(inputEl, onDecodedCallback) {
            const file = inputEl.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    if (window.jsQR) {
                        const code = jsQR(imageData.data, imageData.width, imageData.height);
                        if (code && code.data) {
                            onDecodedCallback(code.data);
                            return;
                        }
                    }
                    showNotification('Could not detect QR code in this image. Enter 4-digit PIN manually.');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function calculateOrderTotal() {
            const vendor = state.vendors.find(v => v.id === state.selectedVendorId) || state.vendors[0];
            const rate = state.orderForm.colorMode === 'bw' ? vendor.bwPrice : vendor.colorPrice;
            const effectiveSheets = state.orderForm.doubleSided ? Math.ceil(state.orderForm.pages / 2) : state.orderForm.pages;
            const printCost = effectiveSheets * state.orderForm.copies * rate;
            const finishingCost = state.orderForm.stapleBind ? 0.50 : 0.00;
            const platformFee = 0.20;
            return {
                rate,
                effectiveSheets,
                printCost: printCost.toFixed(2),
                finishingCost: finishingCost.toFixed(2),
                platformFee: platformFee.toFixed(2),
                total: (printCost + finishingCost + platformFee).toFixed(2)
            };
        }

        function handleQRScanSuccess(rawScan) {
            if (!rawScan) return;
            const clean = rawScan.toString().trim();

            let matchedOrder = state.orders.find(o => 
                o.pickupCode === clean || 
                o.id === clean || 
                clean.includes(o.pickupCode) || 
                clean.includes(o.id)
            );

            if (!matchedOrder) {
                const pinMatch = clean.match(/\b\d{4}\b/);
                if (pinMatch) {
                    matchedOrder = state.orders.find(o => o.pickupCode === pinMatch[0]);
                }
            }

            if (!matchedOrder) {
                matchedOrder = state.orders.find(o => o.status === 'ready' || o.status === 'printing' || o.status === 'paid_escrow');
            }

            if (!matchedOrder) {
                showNotification('Invalid Pick-Up Code. Please scan again.');
                return;
            }

            stopActiveScannerStream();

            // Complete the order & release escrow
            matchedOrder.status = 'completed';
            if (matchedOrder.autoDelete) {
                matchedOrder.fileDeleted = true;
            }
            const payout = matchedOrder.total - 0.20;
            state.vendorEarnings += payout;
            state.walletBalance += payout;
            document.getElementById('wallet-balance-header').textContent = `RM${state.walletBalance.toFixed(2)}`;

            state.walletTransactions.unshift({
                id: 'TXN-' + Math.floor(1000 + Math.random() * 9000),
                type: 'payout',
                title: `QR Verified: ${matchedOrder.fileName}`,
                amount: payout,
                time: 'Just now',
                status: 'Completed',
                method: 'Escrow Release'
            });

            if (window.dbService) {
                window.dbService.saveOrder(matchedOrder);
            }

            playAppSound('chime');
            triggerConfetti();

            closeModal();
            showNotification(`QR Verified! +RM${payout.toFixed(2)} credited to your wallet. Customer file auto-deleted.`);
            render();
        }

                                    <span class="text-xs font-extrabold text-emerald-700">+RM${(order.total - 0.20).toFixed(2)}</span>
                                </div>

                                ${order.status === 'reprint_requested' ? `
                                    <div class="p-2 rounded-xl bg-rose-50 border border-rose-200 text-[11px] text-rose-800 font-semibold">
                                        Reprint Requested: ${order.reprintReason}
                                    </div>
                                ` : ''}

                                <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                                    <span class="text-[10px] font-semibold text-slate-500 flex items-center gap-1">
                                        <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-600"></i>
                                        ${order.fileDeleted ? 'Auto-deleted' : 'Encrypted viewer only'}
                                    </span>

                                    ${order.status === 'paid_escrow' || order.status === 'reprint_requested' ? `
                                        <button onclick="advanceOrderStatus('${order.id}')" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-xs transition">Start Print</button>
                                    ` : order.status === 'printing' ? `
                                        <button onclick="advanceOrderStatus('${order.id}')" class="px-3 py-1.5 bg-pink-600 hover:bg-pink-700 text-white text-xs font-bold rounded-xl shadow-xs transition">Mark Ready</button>
                                    ` : order.status === 'ready' ? `
                                        <button onclick="openVendorQRScanner('${order.id}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold rounded-xl shadow-sm flex items-center gap-1.5 transition active:scale-95 animate-pulse">
                                            <i data-lucide="scan" class="w-3.5 h-3.5"></i>
                                            <span>Scan Student QR</span>
                                        </button>
                                    ` : `
                                        <span class="text-[11px] font-bold text-emerald-600">Escrow Released ✓</span>
                                    `}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderVendorSlots() {
            return `
                <div class="bg-white p-4 rounded-3xl border border-slate-200/80 shadow-sm space-y-3">
                    <div>
                        <h3 class="text-sm font-extrabold text-slate-900">Manage 24/7 Availability Slots</h3>
                        <p class="text-[11px] text-slate-500">Toggle slots when campus shops are closed.</p>
                    </div>
                    <div class="space-y-2">
                        ${state.vendorSlots.map((slot, idx) => `
                            <div class="p-3 rounded-2xl border ${slot.active ? 'border-blue-200 bg-blue-50/40' : 'border-slate-200'} flex items-center justify-between">
                                <span class="text-xs font-bold text-slate-800">${slot.time}</span>
                                <button onclick="toggleSlot(${idx})" class="w-11 h-6 rounded-full transition p-0.5 ${slot.active ? 'bg-blue-600' : 'bg-slate-300'}">
                                    <div class="w-5 h-5 rounded-full bg-white shadow transform transition ${slot.active ? 'translate-x-5' : 'translate-x-0'}"></div>
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="bg-white p-4 rounded-3xl border border-slate-200/80 shadow-sm space-y-2">
                    <h4 class="text-xs font-extrabold uppercase tracking-wider text-slate-500">Your Rates (RM0.15 – RM0.25/pg)</h4>
                    <div class="flex justify-between text-xs py-1.5 border-b border-slate-100">
                        <span class="text-slate-600">Black & White (A4 80gsm)</span>
                        <span class="font-extrabold text-slate-900">RM0.15 / sheet</span>
                    </div>
                    <div class="flex justify-between text-xs py-1.5">
                        <span class="text-slate-600">Full Color</span>
                        <span class="font-extrabold text-slate-900">RM0.50 / sheet</span>
                    </div>
                </div>
            `;
        }

        // --- MASTER RENDER ---
        window.render = function() {
            const content = document.getElementById('app-content');
            const nav = document.getElementById('bottom-nav');

            if (!state.isAuthenticated) {
                content.innerHTML = renderAuthScreen();
                lucide.createIcons();
                return;
            }

            if (state.role === 'student') {
                if (state.studentTab === 'home') content.innerHTML = renderStudentHome();
                else if (state.studentTab === 'upload') content.innerHTML = renderStudentUpload();
                else if (state.studentTab === 'orders') content.innerHTML = renderStudentOrders();
                else if (state.studentTab === 'chat') content.innerHTML = renderStudentChat();

                const activeCount = state.orders.filter(o => o.status !== 'completed').length;

                nav.innerHTML = `
                    <button onclick="setStudentTab('home')" class="flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl ${state.studentTab === 'home' ? 'text-blue-600 bg-blue-50/70' : 'text-slate-400'}">
                        <i data-lucide="compass" class="w-5 h-5"></i>
                        <span class="text-[10px] font-bold">Nearby</span>
                    </button>
                    <button onclick="setStudentTab('upload')" class="flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl ${state.studentTab === 'upload' ? 'text-blue-600 bg-blue-50/70' : 'text-slate-400'}">
                        <i data-lucide="plus-circle" class="w-5 h-5"></i>
                        <span class="text-[10px] font-bold">Print</span>
                    </button>
                    <button onclick="setStudentTab('orders')" class="relative flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl ${state.studentTab === 'orders' ? 'text-blue-600 bg-blue-50/70' : 'text-slate-400'}">
                        <i data-lucide="file-check" class="w-5 h-5"></i>
                        <span class="text-[10px] font-bold">Orders</span>
                        ${activeCount > 0 ? `<span class="absolute top-0.5 right-2 w-4 h-4 rounded-full bg-pink-500 text-white text-[9px] font-extrabold flex items-center justify-center">${activeCount}</span>` : ''}
                    </button>
                    <button onclick="setStudentTab('chat')" class="flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl ${state.studentTab === 'chat' ? 'text-blue-600 bg-blue-50/70' : 'text-slate-400'}">
                        <i data-lucide="message-square" class="w-5 h-5"></i>
                        <span class="text-[10px] font-bold">Chat</span>
                    </button>
                `;
            } else {
                if (state.vendorTab === 'dashboard') content.innerHTML = renderVendorDashboard();
                else if (state.vendorTab === 'slots') content.innerHTML = renderVendorSlots();

                nav.innerHTML = `
                    <button onclick="setVendorTab('dashboard')" class="flex flex-col items-center gap-0.5 px-4 py-1 rounded-xl ${state.vendorTab === 'dashboard' ? 'text-pink-600 bg-pink-50' : 'text-slate-400'}">
                        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                        <span class="text-[10px] font-bold">Print Queue</span>
                    </button>
                    <button onclick="setVendorTab('slots')" class="flex flex-col items-center gap-0.5 px-4 py-1 rounded-xl ${state.vendorTab === 'slots' ? 'text-pink-600 bg-pink-50' : 'text-slate-400'}">
                        <i data-lucide="calendar-clock" class="w-5 h-5"></i>
                        <span class="text-[10px] font-bold">24/7 Slots</span>
                    </button>
                `;
            }

            if (state.showTutorial) {
                renderTutorial();
            }

            lucide.createIcons();
        };

        window.onload = function() {
            updateChromeVisibility();
            window.render();
        };
    </script>
</body>
</html>
