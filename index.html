<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PrintSwift | Peer-to-Peer Student Printing Prototype</title>
    
    <!-- Meta tags for PWA / Mobile -->
    <meta name="description" content="PrintSwift - 24/7 Peer-to-Peer Campus Printing with Escrow Protection & Auto-Delete Privacy for UNIMAS students.">
    <meta name="theme-color" content="#1d4ed8">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <!-- Custom App Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-4 text-slate-800 antialiased selection:bg-pink-500 selection:text-white">

    <!-- Full-Focus Mobile App Device Frame -->
    <div class="w-full max-w-[430px] h-[92vh] max-h-[850px] min-h-[660px] bg-white rounded-[44px] shadow-2xl border-[8px] border-slate-900 overflow-hidden flex flex-col relative">
        
        <!-- Top Status Bar + Quick In-App Role Switcher -->
        <div class="bg-blue-700 text-white px-5 pt-2.5 pb-1.5 flex justify-between items-center text-[11px] font-semibold select-none shrink-0 z-20">
            <span class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-lime-300 animate-pulse"></span>
                <span>23:42 • Late Night</span>
            </span>
            <div class="flex items-center gap-1 bg-blue-900/70 p-0.5 rounded-full border border-blue-500/40">
                <button id="pill-student" onclick="switchRole('student')" class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-lime-300 text-slate-900 transition">Student</button>
                <button id="pill-vendor" onclick="switchRole('vendor')" class="px-2.5 py-0.5 rounded-full text-[10px] font-bold text-blue-100 hover:text-white transition">Vendor</button>
            </div>
        </div>

        <!-- App Header -->
        <header class="bg-blue-600 text-white px-5 pb-4 pt-2 rounded-b-3xl shadow-md shrink-0 z-10">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-2xl bg-lime-300 text-slate-900 flex items-center justify-center font-black text-lg shadow-sm">
                        P
                    </div>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <h1 class="font-extrabold text-base tracking-tight">PrintSwift</h1>
                            <span class="text-[10px] font-bold bg-pink-500 text-white px-1.5 py-0.5 rounded-md">UNIMAS</span>
                        </div>
                        <p id="header-subtitle" class="text-[11px] text-blue-100">Kolej Bunga Raya • 4 Vendors Online</p>
                    </div>
                </div>
                <div class="flex items-center gap-1.5">
                    <button onclick="openWalletModal()" class="px-2.5 py-1.5 rounded-xl bg-blue-500/70 hover:bg-blue-500 text-[11px] font-bold flex items-center gap-1 transition" title="Campus Wallet">
                        <i data-lucide="wallet" class="w-3.5 h-3.5 text-lime-300"></i>
                        <span id="wallet-balance-header">RM25.00</span>
                    </button>
                    <button onclick="openProfileModal()" class="w-8 h-8 rounded-full bg-blue-500/70 hover:bg-blue-500 flex items-center justify-center transition" title="Account & Verification">
                        <i data-lucide="user-check" class="w-4 h-4 text-lime-300"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Toast / Message Box -->
        <div id="toast-box" class="hidden absolute top-24 left-4 right-4 z-50 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-xl border border-slate-700 text-xs flex items-center justify-between gap-2 transition-all">
            <div class="flex items-center gap-2">
                <i data-lucide="sparkles" class="w-4 h-4 text-lime-300 shrink-0"></i>
                <span id="toast-text">Notification message</span>
            </div>
            <button onclick="hideNotification()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>

        <!-- Dynamic Modal Overlay -->
        <div id="app-modal" class="hidden absolute inset-0 z-40 bg-slate-900/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-3">
            <div id="app-modal-body" class="bg-white w-full rounded-3xl p-5 shadow-2xl border border-slate-200 max-h-[84%] overflow-y-auto no-scrollbar space-y-4">
                <!-- Modal content injected dynamically -->
            </div>
        </div>

        <!-- Hidden Native File Input for Real File Selection -->
        <input type="file" id="real-file-input" accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.png" class="hidden" onchange="handleRealFileSelect(event)">

        <!-- MAIN CONTENT AREA (Scrollable) -->
        <main id="app-content" class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4 bg-slate-50/80">
            <!-- Dynamic Views Injected Here -->
        </main>

        <!-- Bottom Navigation Bar -->
        <nav id="bottom-nav" class="bg-white border-t border-slate-200 px-3 py-2 flex justify-around items-center shrink-0 z-10">
            <!-- Dynamic Nav Injected Here -->
        </nav>

        <!-- Home Indicator -->
        <div class="bg-white pb-2 pt-0.5 flex justify-center shrink-0">
            <div class="w-32 h-1 bg-slate-300 rounded-full"></div>
        </div>
    </div>

    <!-- App Engine Script -->
    <script src="js/app.js"></script>
</body>
</html>
